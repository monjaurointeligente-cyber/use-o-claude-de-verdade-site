<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Use o Claude de Verdade</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-shell">

<div style="max-width:420px;margin:24px auto 0;padding:0 24px;">
<a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--cinza);text-decoration:none;font-size:0.9rem;font-weight:600;">&larr; Voltar ao site</a>
</div>

<div class="auth-card">
<h1>Use o Claude de Verdade</h1>
<p style="text-align:center;color:var(--cinza);margin-top:-8px;">O curso é 100% gratuito. Crie seu acesso em segundos.</p>

<div id="login-form">
<div class="field">
<label for="login-email">E-mail</label>
<input type="email" id="login-email" placeholder="voce@email.com">
</div>
<div class="field">
<label for="login-password">Senha</label>
<input type="password" id="login-password" placeholder="Sua senha">
</div>
<button class="btn btn-primary btn-block" id="btn-login">Entrar</button>
<div class="form-msg" id="login-msg"></div>
<div class="auth-switch">
Ainda não tem uma conta?
<a href="#" id="show-signup">Criar acesso grátis</a>
</div>
</div>

<div id="signup-form" style="display:none;">
<div class="field">
<label for="signup-email">Seu e-mail</label>
<input type="email" id="signup-email" placeholder="voce@email.com">
</div>
<div class="field">
<label for="signup-password">Crie uma senha</label>
<input type="password" id="signup-password" placeholder="Mínimo 6 caracteres">
</div>
<button class="btn btn-primary btn-block" id="btn-signup">Criar acesso grátis</button>
<div class="form-msg" id="signup-msg"></div>
<div class="auth-switch">
Já tem senha? <a href="#" id="show-login">Voltar pro login</a>
</div>
</div>
</div>

<script type="module">
import { supabase } from "./supabase-client.js";

const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
document.getElementById('show-signup').onclick = (e) => { e.preventDefault(); loginForm.style.display='none'; signupForm.style.display='block'; };
document.getElementById('show-login').onclick = (e) => { e.preventDefault(); signupForm.style.display='none'; loginForm.style.display='block'; };

document.getElementById('btn-login').onclick = async () => {
const email = document.getElementById('login-email').value.trim();
const password = document.getElementById('login-password').value;
const msg = document.getElementById('login-msg');
msg.textContent = 'Entrando...'; msg.className = 'form-msg';
const { error } = await supabase.auth.signInWithPassword({ email, password });
if (error) {
msg.textContent = 'E-mail ou senha incorretos.';
msg.className = 'form-msg error';
return;
}
window.location.href = 'dashboard.html';
};

document.getElementById('btn-signup').onclick = async () => {
const email = document.getElementById('signup-email').value.trim();
const password = document.getElementById('signup-password').value;
const msg = document.getElementById('signup-msg');
if (password.length < 6) {
msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
msg.className = 'form-msg error';
return;
}
msg.textContent = 'Criando seu acesso...'; msg.className = 'form-msg';
const { data, error } = await supabase.auth.signUp({ email, password });
if (error) {
msg.textContent = 'Não foi possível criar o acesso: ' + error.message;
msg.className = 'form-msg error';
return;
}
msg.textContent = 'Acesso criado! Redirecionando pro curso...';
msg.className = 'form-msg ok';
if (data.session) {
setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
} else {
msg.textContent = 'Acesso criado! Verifique seu e-mail se for solicitado, depois faça login.';
}
};
</script>
</body>
</html>
