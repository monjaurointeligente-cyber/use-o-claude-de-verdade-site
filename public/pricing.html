<html lang="pt-BR">

  <title>PromptPalm - Pricing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(to bottom, #f8fafc, #f1f5f9); min-height: 100vh; padding: 3rem 1rem; }
    .container { max-width: 70rem; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 3rem; }
    .header h1 { font-size: 2.25rem; color: #0f172a; margin-bottom: 1rem; font-weight: 700; }
    .header p { font-size: 1.125rem; color: #475569; }
    .pricing-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 56rem; margin: 0 auto 4rem; }
    .card { border-radius: 0.5rem; padding: 2rem; display: flex; flex-direction: column; transition: all 0.3s ease; }
    .card.basic { background: white; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); }
    .card.pro { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; transform: scale(1.05); box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.3); }
    .card.pro .price { color: white; }
    .card.pro .description { color: #dbeafe; }
    .card.pro .feature { color: white; }
    .badge { display: inline-block; background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; width: fit-content; }
    .card h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .description { color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .price { font-size: 3rem; font-weight: 700; color: #0f172a; margin-bottom: 0.25rem; }
    .price-period { font-size: 0.875rem; color: #64748b; margin-bottom: 2rem; }
    .card.pro .price-period { color: #bfdbfe; }
    .cta-button { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 600; text-align: center; text-decoration: none; transition: all 0.3s ease; margin-bottom: 2rem; border: none; cursor: pointer; font-size: 1rem; }
    .card.basic .cta-button { background: #2563eb; color: white; }
    .card.basic .cta-button:hover { background: #1d4ed8; }
    .card.pro .cta-button { background: white; color: #2563eb; }
    .card.pro .cta-button:hover { background: #f0f9ff; }
